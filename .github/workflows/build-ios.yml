name: Build iOS XCFramework

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-ios:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build XCFramework and Swift package
        run: make ios

      # Publish from the build job, where the zip and the Package.swift that
      # pins its checksum already exist.
      # Tags publish to their own release, main to the rolling pre-release
      # (keep in sync with maven/ios/create-swift-package). Manual runs on
      # other branches do not publish, so they cannot overwrite rolling.
      - name: Publish XCFramework and Swift package to GitHub release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if ! gh release view "${tag}" >/dev/null 2>&1; then
              # Another workflow may create the release at the same time.
              gh release create "${tag}" --verify-tag --title "${tag}" --notes "" \
                || gh release view "${tag}" >/dev/null
            fi
          else
            tag="rolling"
            # Move the rolling tag to this commit so the release matches its assets.
            git tag -f "${tag}" "${GITHUB_SHA}"
            git push -f origin "refs/tags/${tag}"
            if ! gh release view "${tag}" >/dev/null 2>&1; then
              gh release create "${tag}" --prerelease --verify-tag --title "${tag}" \
                --notes "Rolling build of main. Assets are replaced on every push."
            fi
          fi
          gh release upload "${tag}" --clobber \
            ios/passport.xcframework.zip \
            ios/Package.swift \
            ios/Sources/OoniProbe/ooniprobe.swift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: passport.xcframework.zip
          path: ios/passport.xcframework.zip

      - name: Upload Swift Bindings
        uses: actions/upload-artifact@v6
        with:
          name: ooniprobe-swift
          path: ios/Sources/OoniProbe/*.swift

  publish-ios:
    runs-on: ubuntu-latest
    needs: build-ios

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: passport.xcframework.zip
          path: maven/ios

      - name: Set Project Version
        working-directory: maven/ios
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
            VERSION="${SHORT_SHA}"
          fi
          echo "Generated version: $VERSION"

          mvn versions:set \
            -DnewVersion=${VERSION} \
            -DremoveSnapshot=true
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate Podspec
        working-directory: maven/ios
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${VERSION}"
          else
            RELEASE_VERSION="0.1.0+${VERSION}" 
          fi

          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@RELEASE_VERSION@/${RELEASE_VERSION}/g" passport-template.podspec > passport.podspec
          echo "Generated podspec with version: $VERSION, release version: $RELEASE_VERSION"
          cat passport.podspec

      - name: Publish to Maven Central
        working-directory: maven/ios
        run: |
          mvn clean deploy \
            -Dios.xcframework.name=$(ls *.zip | xargs basename) \
            -Dios.podspec.file=${PWD}/passport.podspec \
            --batch-mode \
            -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
